        accountId: { type: [string, 'null'] }
        entitlementId: { type: [string, 'null'] }
        licenseState: { type: string, enum: [ACTIVE, GRACE, EXPIRED, REVOKED] }
        cloneAllowed: { type: boolean }
        lastVerifiedAt: { type: [string, 'null'], format: date-time }
        entitlementValidUntil: { type: [string, 'null'], format: date-time }
        graceUntil: { type: [string, 'null'], format: date-time }
        installedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TemplateInstallationResponse:
      type: object
      required: [template, installation]
      properties:
        template: { $ref: '#/components/schemas/PrintTemplate' }
        installation: { $ref: '#/components/schemas/TemplateInstallation' }

    CloudTemplateCatalogStatus:
      type: object
      required: [provider, enabled, configured, available, publisherEnabled, accountConfigured, message]
      properties:
        provider: { type: string }
        enabled: { type: boolean }
        configured: { type: boolean }
        available: { type: boolean }
        publisherEnabled: { type: boolean }
        accountConfigured: { type: boolean }
        message: { type: string }

    CloudTemplateSummary:
      type: object
      required:
        [code, name, documentType, versionNo, publishedAt, uploadedAt, accessModel, cloneAllowed, entitled,
         entitlementState, category, description, tags, thumbnailStyle, featured, sortOrder, paperLabel]
      properties:
        code: { type: string }
        name: { type: string }
        documentType: { $ref: '#/components/schemas/DocumentType' }
        versionNo: { type: integer, minimum: 1 }
        changeNote: { type: [string, 'null'] }
        publishedAt: { type: string, format: date-time }
        uploadedAt: { type: string, format: date-time }
        sourceInstance: { type: [string, 'null'] }
        accessModel: { type: string, enum: [FREE, SUBSCRIPTION] }
        productCode: { type: [string, 'null'] }
        planCode: { type: [string, 'null'] }
        cloneAllowed: { type: boolean }
        entitled: { type: boolean }
        entitlementState: { type: string, enum: [ACTIVE, GRACE, EXPIRED, REVOKED, MISSING] }
        category:
          type: string
          enum: [FINANCE, SALES, PURCHASE, WAREHOUSE, RETAIL, MEDICAL, LOGISTICS, OTHER]
        description: { type: string }
        tags:
          type: array
          items: { type: string }
        thumbnailStyle: { type: string }
        featured: { type: boolean }
        sortOrder: { type: integer }
        paperLabel: { type: string }

    CloudTemplateBundle:
      allOf:
        - { $ref: '#/components/schemas/CloudTemplateSummary' }
        - type: object
          required: [design, sampleData, dataConfig]
          properties:
            design: { $ref: '#/components/schemas/TemplateDesign' }
            sampleData: { $ref: '#/components/schemas/TemplateSampleData' }
            dataConfig: { $ref: '#/components/schemas/TemplateDataConfig' }

    TemplateStatus:
      type: string
      enum: [DRAFT, TESTING, REVIEWING, PUBLISHED, DISABLED]

    DocumentType:
      type: string
      enum: [FORM, INVOICE, RECEIPT, EXPENSE_LIST, POS_RECEIPT, LABEL, REPORT]

    TemplateDataMode:
      type: string
      enum: [JSON, SQL]

    TemplateQueryResultType:
      type: string
      enum: [OBJECT, ARRAY, SCALAR]

    TemplateQueryParamType:
      type: string
      enum: [STRING, INTEGER, DECIMAL, BOOLEAN, DATE, DATETIME]

    TemplateQueryParam:
      type: object
      required: [name, type, required]
      properties:
        name:
          type: string
          pattern: '^[A-Za-z_][A-Za-z0-9_]{0,63}$'
        type: { $ref: '#/components/schemas/TemplateQueryParamType' }
        required: { type: boolean }
        defaultValue:
          description: Scalar default value converted according to param type.
          oneOf:
            - { type: string }
            - { type: integer }
            - { type: number }
            - { type: boolean }
            - { type: 'null' }

    TemplateQueryConfig:
      type: object
      required: [queryId, name, connectionId, sql, params, resultKey, resultType, order, enabled]
      properties:
        queryId:
          type: string
          pattern: '^[a-z][a-z0-9-]{1,63}$'
        name: { type: string, minLength: 1 }
        connectionId: { type: string, minLength: 1 }
        sql:
          type: string
          minLength: 1
          description: One read-only SELECT or WITH...SELECT statement using named parameters.
        params:
          type: array
          items: { $ref: '#/components/schemas/TemplateQueryParam' }
        resultKey:
          type: string
          pattern: '^[A-Za-z_][A-Za-z0-9_]{0,63}$'
          not:
            enum: [__proto__, prototype, constructor]
        resultType: { $ref: '#/components/schemas/TemplateQueryResultType' }
        order: { type: integer }
        enabled: { type: boolean }
        timeoutMs:
          type: integer
          minimum: 100
          maximum: 30000
        maxRows:
          type: integer
          minimum: 1
          maximum: 10000

    TemplateDataConfig:
      type: object
      required: [schemaVersion, mode, queries]
      properties:
        schemaVersion:
          type: integer
          const: 1
        mode: { $ref: '#/components/schemas/TemplateDataMode' }
        queries:
          type: array
          items: { $ref: '#/components/schemas/TemplateQueryConfig' }
      examples:
        - schemaVersion: 1
          mode: JSON
          queries: []

    TemplateDesign:
      type: object
      additionalProperties: true
      description: Existing visual template design JSON.

    TemplateSampleData:
      type: object
      additionalProperties: true
      description: Stable sample data contract used for design-time preview and binding validation.

    CreateTemplateRequest:
      type: object
      required: [code, name, documentType]
      properties:
        code: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        documentType: { $ref: '#/components/schemas/DocumentType' }

    SaveTemplateDraftRequest:
      type: object
      required: [design, sampleData]
      properties:
        name:
          type: [string, 'null']
          description: Null/blank keeps the current template name.
        design: { $ref: '#/components/schemas/TemplateDesign' }
        sampleData: { $ref: '#/components/schemas/TemplateSampleData' }
        dataConfig:
          oneOf:
            - { $ref: '#/components/schemas/TemplateDataConfig' }
            - { type: 'null' }
          description: Null/omitted keeps the current dataConfig for backward compatibility.

    PrintTemplate:
      type: object
      required:
        [id, code, name, documentType, status, draftRevision, design, sampleData, dataConfig, createdAt, updatedAt]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        documentType: { $ref: '#/components/schemas/DocumentType' }
        status: { $ref: '#/components/schemas/TemplateStatus' }
        draftRevision: { type: integer, minimum: 1 }
        publishedVersion: { type: [integer, 'null'], minimum: 1 }
        design: { $ref: '#/components/schemas/TemplateDesign' }
        sampleData: { $ref: '#/components/schemas/TemplateSampleData' }
        dataConfig: { $ref: '#/components/schemas/TemplateDataConfig' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PrintTemplateVersion:
      type: object
      required: [id, templateId, versionNo, design, sampleData, dataConfig, createdAt]
      properties:
        id: { type: string }
        templateId: { type: string }
        versionNo: { type: integer, minimum: 1 }
        design: { $ref: '#/components/schemas/TemplateDesign' }
        sampleData: { $ref: '#/components/schemas/TemplateSampleData' }
        dataConfig: { $ref: '#/components/schemas/TemplateDataConfig' }
        changeNote: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    ReleaseScopeType:
      type: string
      enum: [ALL, ORG, CAMPUS, DEPARTMENT, TERMINAL]

    ReleaseScope:
      type: object
      properties:
        type:
          allOf:
            - { $ref: '#/components/schemas/ReleaseScopeType' }
          default: ALL
        values:
          type: array
          items: { type: string }
          default: []
      required: [type, values]

    PublishTemplateRequest:
      type: object
      properties:
        changeNote: { type: [string, 'null'] }
        scope:
          oneOf:
            - { $ref: '#/components/schemas/ReleaseScope' }
            - { type: 'null' }

    RollbackTemplateRequest:
      type: object
      required: [versionNo]
      properties:
        versionNo: { type: integer, minimum: 1 }
        changeNote: { type: [string, 'null'] }
        scope:
          oneOf:
            - { $ref: '#/components/schemas/ReleaseScope' }
            - { type: 'null' }

    TemplateRelease:
      type: object
      required: [id, templateId, versionNo, scopeType, scopeValues, active, createdAt]
      properties:
        id: { type: string }
        templateId: { type: string }
        versionNo: { type: integer, minimum: 1 }
        scopeType: { $ref: '#/components/schemas/ReleaseScopeType' }
        scopeValues:
          type: array
          items: { type: string }
        rollbackFromVersion: { type: [integer, 'null'], minimum: 1 }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }

    TemplateAuditEvent:
      type: object
      required: [id, templateId, action, detail, createdAt]
      properties:
        id: { type: integer, format: int64 }
        templateId: { type: string }
        action: { type: string }
        detail:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }

    TemplateValidationResult:
      type: object
      required: [valid, errors, warnings]
      properties:
        valid: { type: boolean }
        errors:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { type: string }

    AiLayoutRequest:
      type: object
      required: [imageDataUrl, paperWidth, paperHeight, sensitiveImageConfirmed]
      properties:
        imageDataUrl: { type: string, minLength: 1 }
        paperWidth: { type: number }
        paperHeight: { type: number }
        sensitiveImageConfirmed: { type: boolean }
        hint: { type: [string, 'null'] }

    AiLayoutResponse:
      type: object
      required: [taskId, status, provider, model, candidates, message]
      properties:
        taskId: { type: string }
        status: { type: string }
        provider: { type: string }
        model: { type: string }
        candidates:
          type: array
          items:
            type: object
            additionalProperties: true
        message: { type: string }

    TemplateAiTask:
      type: object
      required: [id, templateId, provider, model, status, request, result, createdAt, updatedAt]
      properties:
        id: { type: string }
        templateId: { type: string }
        provider: { type: string }
        model: { type: string }
        status: { type: string }
        request:
          type: object
          additionalProperties: true
        result:
          description: Provider-dependent AI result.
        errorMessage: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TemplateTestTarget:
      type: object
      required: [kind, draftRevision, versionNo]
      properties:
        kind:
          type: string
          enum: [DRAFT, VERSION]
        draftRevision: { type: [integer, 'null'], minimum: 1 }
        versionNo: { type: [integer, 'null'], minimum: 1 }

    TemplateTestRequest:
      type: object
      properties:
        versionNo:
          type: [integer, 'null']
          minimum: 1
          description: Null/omitted selects the current saved draft.
        params:
          type: object
          additionalProperties: true
          default: {}
        inputData:
          oneOf:
            - { $ref: '#/components/schemas/TemplateSampleData' }
            - { type: 'null' }
          description: Allowed only in JSON mode; SQL mode rejects non-null inputData.
        printerId:
          type: [string, 'null']
          description: Required for plugin-print tests.

    TemplateSnapshot:
      type: object
      required: [templateId, code, name, documentType, design]
      properties:
        templateId: { type: string }
        code: { type: string }
        name: { type: string }
        documentType: { $ref: '#/components/schemas/DocumentType' }
        design: { $ref: '#/components/schemas/TemplateDesign' }

    QueryExecutionStatus:
      type: string
      enum: [PENDING, RUNNING, SUCCESS, FAILED, SKIPPED]

    QueryExecutionSummary:
      type: object
      required: [queryId, status]
      properties:
        queryId: { type: string }
        name: { type: [string, 'null'] }
        resultKey: { type: [string, 'null'] }
        resultType:
          oneOf:
            - { $ref: '#/components/schemas/TemplateQueryResultType' }
            - { type: 'null' }
        status: { $ref: '#/components/schemas/QueryExecutionStatus' }
        rowCount: { type: [integer, 'null'], minimum: 0 }
        elapsedMs: { type: [integer, 'null'], minimum: 0 }
        errorCode: { type: [string, 'null'] }
        errorMessage: { type: [string, 'null'] }

    TestRunStatus:
      type: string
      enum: [RUNNING, SUCCESS, FAILED]

    TestType:
      type: string
      enum: [QUERY, PREVIEW, SIMULATED_PRINT, PLUGIN_PRINT]

    RenderStatus:
      type: string
      enum: [NOT_STARTED, SUCCESS, FAILED]

    PrintStatus:
      type: string
      enum: [NOT_REQUESTED, PENDING, SUCCESS, FAILED]

    PrintChannel:
      type: string
      enum: [NONE, SIMULATED, BROWSER_EXTENSION_AGENT]

    TemplateTestError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    QueryTestResponse:
      type: object
      required: [testRunId, status, target]
      properties:
        testRunId: { type: string }
        status: { $ref: '#/components/schemas/TestRunStatus' }
        target: { $ref: '#/components/schemas/TemplateTestTarget' }
        query:
          oneOf:
            - { $ref: '#/components/schemas/QueryExecutionSummary' }
            - { type: 'null' }
        result:
          description: Query result mapped according to resultType.
        error:
          oneOf:
            - { $ref: '#/components/schemas/TemplateTestError' }
            - { type: 'null' }

    TestDataResponse:
      type: object
      required: [testRunId, status, dataMode, target, templateSnapshot, renderData, queries, renderStatus, elapsedMs]
      properties:
        testRunId: { type: string }
        status: { $ref: '#/components/schemas/TestRunStatus' }
        dataMode: { $ref: '#/components/schemas/TemplateDataMode' }
        target: { $ref: '#/components/schemas/TemplateTestTarget' }
        templateSnapshot: { $ref: '#/components/schemas/TemplateSnapshot' }
        renderData: { $ref: '#/components/schemas/TemplateSampleData' }
        queries:
          type: array
          items: { $ref: '#/components/schemas/QueryExecutionSummary' }
        renderStatus: { $ref: '#/components/schemas/RenderStatus' }
        elapsedMs: { type: integer, minimum: 0 }
        error:
          oneOf:
            - { $ref: '#/components/schemas/TemplateTestError' }
            - { type: 'null' }

    RenderResultRequest:
      type: object
      required: [success, elapsedMs]
      properties:
        success: { type: boolean }
        pageCount: { type: [integer, 'null'], minimum: 0 }
        elapsedMs: { type: integer, minimum: 0 }
        message: { type: [string, 'null'] }

    PrintResultRequest:
      type: object
      required: [channel, success, elapsedMs]
      properties:
        channel:
          type: string
          enum: [SIMULATED, BROWSER_EXTENSION_AGENT]
        success: { type: boolean }
        printerId: { type: [string, 'null'] }
        agentJobId: { type: [string, 'null'] }
        elapsedMs: { type: integer, minimum: 0 }
        message: { type: [string, 'null'] }

    TemplateTestRunSummary:
      type: object
      required:
        [id, templateId, dataMode, testType, status, renderStatus, printChannel, printStatus, startedAt, payloadPersisted]
      properties:
        id: { type: string }
        templateId: { type: string }
        templateVersion: { type: [integer, 'null'], minimum: 1 }
        draftRevision: { type: [integer, 'null'], minimum: 1 }
        dataMode: { $ref: '#/components/schemas/TemplateDataMode' }
        testType: { $ref: '#/components/schemas/TestType' }
        status: { $ref: '#/components/schemas/TestRunStatus' }
        renderStatus: { $ref: '#/components/schemas/RenderStatus' }
        printChannel: { $ref: '#/components/schemas/PrintChannel' }
        printStatus: { $ref: '#/components/schemas/PrintStatus' }
        printerId: { type: [string, 'null'] }
        pageCount: { type: [integer, 'null'], minimum: 0 }
        agentJobId: { type: [string, 'null'] }
        errorCode: { type: [string, 'null'] }
        message: { type: [string, 'null'] }
        payloadPersisted: { type: boolean }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        elapsedMs: { type: [integer, 'null'], minimum: 0 }

    TemplateTestRunDetail:
      allOf:
        - { $ref: '#/components/schemas/TemplateTestRunSummary' }
        - type: object
          required: [queries]
          properties:
            inputParams:
              type: [object, 'null']
              additionalProperties: true
            inputData:
              oneOf:
                - { $ref: '#/components/schemas/TemplateSampleData' }
                - { type: 'null' }
            renderData:
              oneOf:
                - { $ref: '#/components/schemas/TemplateSampleData' }
                - { type: 'null' }
            queries:
              type: array
              items: { $ref: '#/components/schemas/QueryExecutionSummary' }
