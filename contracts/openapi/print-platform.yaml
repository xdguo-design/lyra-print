openapi: 3.1.0
info:
  title: Print Platform API
  version: 0.3.0
  description: |
    Print Platform contract for print tasks, template lifecycle, template data configuration,
    template test runs, AI-assisted layout, and multi-database source connections.

    Template data/testing endpoints are implemented. Test runs are isolated from formal print tasks,
    and SQL execution uses backend-only read-only data source connections.
servers:
  - url: http://localhost:8080

tags:
  - name: Print Tasks
  - name: Business Integration
  - name: Printers
  - name: Runtime
  - name: Data Sources
  - name: Templates
  - name: Cloud Templates
  - name: Template Tests
  - name: Template AI
  - name: Reports

paths:
  /api/auth/session:
    get:
      tags: [Runtime]
      operationId: getAuthSession
      description: Validates the configured API key and returns the effective RBAC role when backend authentication is enabled.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Effective authenticated session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401':
          description: Missing or invalid API key

  /api/print-previews:
    post:
      tags: [Business Integration]
      operationId: createPrintPreview
      description: |
        Resolves the currently published template version and runtime business data for an embedded
        business-system preview. This endpoint does not create a PrintTask and does not talk to the
        browser extension or local Print Agent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePrintPreviewRequest' }
      responses:
        '200':
          description: Published template design and resolved runtime render data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrintPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/print-tasks:
    get:
      tags: [Print Tasks]
      operationId: listPrintTasks
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/PrintTaskStatus' } }
        - { name: templateCode, in: query, schema: { type: string } }
        - { name: printerId, in: query, schema: { type: string } }
        - { name: keyword, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        '200':
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PrintTask' }
    post:
      tags: [Print Tasks]
      operationId: createPrintTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePrintTaskRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrintTask' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/print-tasks/pdf:
    post:
      tags: [Print Tasks]
      operationId: createPdfPrintTask
      description: Creates a formal audited PrintTask whose immutable snapshot is a PDF document.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePdfPrintTaskRequest' }
      responses:
        '201':
          description: Created PDF print task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrintTask' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/print-tasks/raw:
    post:
      tags: [Print Tasks]
      operationId: createRawPrintTask
      description: Creates a formal audited PrintTask whose immutable snapshot is the final RAW byte stream.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRawPrintTaskRequest' }
      responses:
        '201':
          description: Created RAW print task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrintTask' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/print-tasks/{taskId}/spooler-binding:
    post:
      tags: [Print Tasks]
      operationId: bindPrintTaskSpoolerJob
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpoolerBindingRequest' }
      responses:
        '200':
          description: Updated print attempt with exact Windows Spooler binding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrintAttempt' }

  /api/print-tasks/{taskId}/spooler-status:
    post:
      tags: [Print Tasks]
      operationId: updatePrintTaskSpoolerStatus
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpoolerStatusRequest' }
      responses:
        '200':
          description: Updated spooler observation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrintAttempt' }

  /api/print-tasks/summary:
    get:
      tags: [Print Tasks]
      operationId: getPrintTaskSummary
      responses:
        '200':
          description: Current formal task status counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrintTaskSummary' }

  /api/print-tasks/{taskId}:
    get:
      tags: [Print Tasks]
      operationId: getPrintTask
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200':
          description: Task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrintTask' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/print-tasks/{taskId}/document:
    get:
      tags: [Print Tasks]
      operationId: getPrintTaskDocument
      description: Returns the immutable template design and renderData frozen when the formal task was created.
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200':
          description: Frozen formal print document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrintTaskDocument' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/print-tasks/{taskId}/attempts:
    get:
      tags: [Print Tasks]
      operationId: listPrintTaskAttempts
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200':
          description: Attempts for one print task
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PrintAttempt' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/print-tasks/{taskId}/queue:
    post:
      tags: [Print Tasks]
      operationId: queuePrintTask
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200': { $ref: '#/components/responses/PrintTaskResponse' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/print-tasks/{taskId}/start:
    post:
      tags: [Print Tasks]
      operationId: startPrintTask
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200': { $ref: '#/components/responses/PrintTaskResponse' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/print-tasks/{taskId}/success:
    post:
      tags: [Print Tasks]
      operationId: completePrintTask
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200': { $ref: '#/components/responses/PrintTaskResponse' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/print-tasks/{taskId}/fail:
    post:
      tags: [Print Tasks]
      operationId: failPrintTask
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FailPrintTaskRequest' }
      responses:
        '200': { $ref: '#/components/responses/PrintTaskResponse' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/print-tasks/{taskId}/retry:
    post:
      tags: [Print Tasks]
      operationId: retryPrintTask
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetryPrintTaskRequest' }
      responses:
        '200': { $ref: '#/components/responses/PrintTaskResponse' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/print-tasks/{taskId}/wait-agent:
    post:
      tags: [Print Tasks]
      operationId: waitForPrintAgent
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WaitForAgentRequest' }
      responses:
        '200': { $ref: '#/components/responses/PrintTaskResponse' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/print-tasks/{taskId}/cancel:
    post:
      tags: [Print Tasks]
      operationId: cancelPrintTask
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200': { $ref: '#/components/responses/PrintTaskResponse' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/system-logs:
    get:
      tags: [Runtime]
      operationId: listSystemLogs
      parameters:
        - { name: level, in: query, schema: { type: string, enum: [DEBUG, INFO, WARN, ERROR, FATAL] } }
        - { name: module, in: query, schema: { type: string } }
        - { name: eventType, in: query, schema: { type: string } }
        - { name: taskId, in: query, schema: { type: string } }
        - { name: attemptId, in: query, schema: { type: integer } }
        - { name: agentId, in: query, schema: { type: string } }
        - { name: printerId, in: query, schema: { type: string } }
        - { name: spoolerJobId, in: query, schema: { type: integer } }
        - { name: resolved, in: query, schema: { type: boolean } }
        - { name: keyword, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Filtered system log page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemLogPage' }

  /api/system-logs/{id}:
    get:
      tags: [Runtime]
      operationId: getSystemLog
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: System log detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemLogEntry' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/system-logs/batch:
    post:
      tags: [Runtime]
      operationId: uploadSystemLogs
      description: Agent batch upload endpoint. Maximum 200 entries per request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 200
              items: { $ref: '#/components/schemas/SystemLogBatchItemRequest' }
      responses:
        '200':
          description: Accepted batch count

  /api/system-logs/{id}/resolve:
    post:
      tags: [Runtime]
      operationId: resolveSystemLog
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Resolved system log
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemLogEntry' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/system-logs/cleanup:
    post:
      tags: [Runtime]
      operationId: cleanupSystemLogs
      description: Runs one bounded, batched retention cleanup pass. Active PrintTask logs and unresolved ERROR/FATAL logs are protected.
      responses:
        '200':
          description: Cleanup summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemLogCleanupResult' }

  /api/agents:
    get:
      tags: [Runtime]
      operationId: listAgents
      responses:
        '200':
          description: Agent instances
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AgentInstance' }

  /api/agents/heartbeat:
    post:
      tags: [Runtime]
      operationId: agentHeartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentHeartbeatRequest' }
      responses:
        '200':
          description: Heartbeat accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentHeartbeatResponse' }

  /api/agents/{agentId}/instances/{instanceId}/heartbeats:
    get:
      tags: [Runtime]
      operationId: listAgentHeartbeats
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string } }
        - { name: instanceId, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 120 } }
      responses:
        '200':
          description: Agent heartbeat history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AgentHeartbeat' }

  /api/agents/{agentId}/instances/{instanceId}/printers:
    get:
      tags: [Runtime]
      operationId: listAgentPrinters
      description: Latest printer inventory reported by the selected print node.
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string } }
        - { name: instanceId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Printers currently reported by the node
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AgentPrinter' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/agents/{agentId}/instances/{instanceId}/printers/detail:
    get:
      tags: [Runtime]
      operationId: getAgentPrinter
      description: Uses printerId as a query parameter so IDs containing URI/path characters are handled safely.
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string } }
        - { name: instanceId, in: path, required: true, schema: { type: string } }
        - { name: printerId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Latest details for one printer reported by the node
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentPrinter' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/alerts:
    get:
      tags: [Runtime]
      operationId: listAlerts
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [OPEN, ACKED, RESOLVED] } }
        - { name: severity, in: query, schema: { type: string } }
        - { name: ruleCode, in: query, schema: { type: string } }
        - { name: resourceType, in: query, schema: { type: string } }
        - { name: agentId, in: query, schema: { type: string } }
        - { name: printerId, in: query, schema: { type: string } }
        - { name: keyword, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Alert page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertPage' }

  /api/alerts/rules:
    get:
      tags: [Runtime]
      operationId: listAlertRules
      responses:
        '200':
          description: Alert rules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AlertRule' }

  /api/alerts/{id}/ack:
    post:
      tags: [Runtime]
      operationId: acknowledgeAlert
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Acknowledged alert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertEvent' }

  /api/alerts/{id}/resolve:
    post:
      tags: [Runtime]
      operationId: resolveAlert
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Resolved alert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertEvent' }

  /api/alerts/rules/{code}/enabled:
    post:
      tags: [Runtime]
      operationId: setAlertRuleEnabled
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: enabled, in: query, required: true, schema: { type: boolean } }
      responses:
        '200':
          description: Updated alert rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertRule' }

  /api/printers:
    get:
      tags: [Printers]
      operationId: listPrinterProfiles
      responses:
        '200':
          description: Platform-managed printer profiles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PrinterProfile' }

  /api/printers/{printerId}:
    get:
      tags: [Printers]
      operationId: getPrinterProfile
      parameters:
        - { name: printerId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Printer profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrinterProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
    put:
      tags: [Printers]
      operationId: savePrinterProfile
      description: |
        Stores platform policy metadata for a printer discovered by the local Agent.
        A managed printer with enabled=false is blocked from formal task creation, queueing, and retry.
      parameters:
        - { name: printerId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavePrinterProfileRequest' }
      responses:
        '200':
          description: Saved printer profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrinterProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/runtime/capabilities:
    get:
      tags: [Runtime]
      operationId: getRuntimeCapabilities
      responses:
        '200':
          description: Runtime authentication/RBAC protection state and deployment warnings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeCapabilities' }

  /api/data-sources/connections:
    get:
      tags: [Data Sources]
      operationId: listDataSourceConnections
      responses:
        '200':
          description: Configured database connections
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DataSourceConnection' }
    post:
      tags: [Data Sources]
      operationId: createDataSourceConnection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDataSourceConnectionRequest' }
      responses:
        '201':
          description: Saved connection metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSourceConnection' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/data-sources/connections/{connectionId}:
    get:
      tags: [Data Sources]
      operationId: getDataSourceConnection
      parameters: [{ $ref: '#/components/parameters/ConnectionId' }]
      responses:
        '200':
          description: Connection metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSourceConnection' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/data-sources/connections/test:
    post:
      tags: [Data Sources]
      operationId: testDataSourceConnection
      description: Tests a database connection. The password in this request is not persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestDataSourceConnectionRequest' }
      responses:
        '200':
          description: Connection test result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionTestResult' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/cloud-templates/status:
    get:
      tags: [Cloud Templates]
      operationId: getCloudTemplateCatalogStatus
      responses:
        '200':
          description: Online template catalog configuration and connectivity state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloudTemplateCatalogStatus' }

  /api/cloud-templates:
    get:
      tags: [Cloud Templates]
      operationId: listCloudTemplates
      description: Lists the built-in Print Platform Original marketplace plus the latest external cloud version for each template code.
      responses:
        '200':
          description: Latest online published template snapshots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CloudTemplateSummary' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/cloud-templates/upload/{templateId}:
    post:
      tags: [Cloud Templates]
      operationId: uploadPublishedTemplateToCloud
      description: Publisher-only operation. Publishes the current immutable local version into the online marketplace with FREE or SUBSCRIPTION access metadata. Draft state is never uploaded.
      parameters:
        - { name: templateId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishCloudTemplateRequest' }
      responses:
        '200':
          description: Published marketplace snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloudTemplateSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/cloud-templates/{code}/versions/{versionNo}:
    get:
      tags: [Cloud Templates]
      operationId: getCloudTemplateVersion
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: versionNo, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: One online immutable template snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloudTemplateBundle' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/template-installations:
    get:
      tags: [Cloud Templates]
      operationId: listTemplateInstallations
      responses:
        '200':
          description: Locally cached online template packages and license state
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TemplateInstallation' }

  /api/template-installations/cloud/{code}/versions/{versionNo}:
    post:
      tags: [Cloud Templates]
      operationId: installCloudTemplate
      description: Installs or upgrades an entitled online template as a managed local package; it is not converted into an editable local draft.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: versionNo, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Installed managed template package
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateInstallationResponse' }
        '403':
          description: Subscription entitlement is missing, expired, or revoked
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/template-installations/{localTemplateId}/refresh-license:
    post:
      tags: [Cloud Templates]
      operationId: refreshTemplateInstallationLicense
      parameters:
        - { name: localTemplateId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Refreshed cached entitlement state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateInstallation' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/templates:
    get:
      tags: [Templates]
      operationId: listTemplates
      responses:
        '200':
          description: Template list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PrintTemplate' }
    post:
      tags: [Templates]
      operationId: createTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTemplateRequest' }
      responses:
        '201':
          description: Created template
          content:
            application/json:
