        username: { type: [string, 'null'] }
        secretRef:
          type: [string, 'null']
          description: |
            Reference to a secret; the password itself is not persisted.
            The initial resolver supports env:VARIABLE_NAME references.
        readOnly: { type: boolean }
        enabled: { type: boolean }

    TestDataSourceConnectionRequest:
      type: object
      required: [dbType, jdbcUrl, readOnly]
      properties:
