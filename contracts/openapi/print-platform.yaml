        jdbcUrl: { type: string }
        username: { type: [string, 'null'] }
        password:
          type: [string, 'null']
          writeOnly: true
          description: Used only for this connection test and not persisted.
        readOnly: { type: boolean }

    DataSourceConnection:
      type: object
      required: [id, name, dbType, jdbcUrl, readOnly, enabled, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        dbType: { $ref: '#/components/schemas/DatabaseType' }
