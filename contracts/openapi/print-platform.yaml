components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Print Platform API Key sent as Authorization: Bearer <key>."
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Print-Api-Key
      description: Alternative header for Print Platform API Key authentication.
  parameters:
    FromDateTime:
      name: from
      in: query
      required: false
      schema: { type: string }
      description: Inclusive report range start accepted by the backend report parser.
    ToDateTime:
      name: to
      in: query
      required: false
      schema: { type: string }
      description: Inclusive report range end accepted by the backend report parser.
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string }
    ConnectionId:
      name: connectionId
      in: path
      required: true
      schema: { type: string }
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: string }
    QueryId:
      name: queryId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]{1,63}$'
    TestRunId:
      name: testRunId
      in: path
      required: true
      schema: { type: string }

  responses:
    PrintTaskResponse:
      description: Print task
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PrintTask' }
    ServiceUnavailable:
      description: Optional online service is disabled, not configured, or temporarily unavailable
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

    BadRequest:
      description: Invalid request or static configuration
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: Requested resource does not exist
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Conflict:
      description: Concurrent modification or invalid state transition
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

  schemas:
    ReportSummary:
      type: object
      required: [from, to, total, succeeded, failed, cancelled, active, attempts, successRate]
      properties:
        from: { type: string }
        to: { type: string }
        total: { type: integer, format: int64 }
        succeeded: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        cancelled: { type: integer, format: int64 }
        active: { type: integer, format: int64 }
        attempts: { type: integer, format: int64 }
        successRate: { type: number, format: double }

    ReportDailyRow:
      type: object
      required: [date, total, succeeded, failed, cancelled, successRate]
      properties:
        date: { type: string }
        total: { type: integer, format: int64 }
        succeeded: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        cancelled: { type: integer, format: int64 }
        successRate: { type: number, format: double }

    ReportPrinterRow:
      type: object
      required: [printerId, total, succeeded, failed, successRate]
      properties:
        printerId: { type: string }
        total: { type: integer, format: int64 }
        succeeded: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        successRate: { type: number, format: double }
        lastPrintAt: { type: [string, 'null'] }

    ReportTemplateRow:
      type: object
      required: [templateCode, total, succeeded, failed, successRate]
      properties:
        templateCode: { type: string }
        total: { type: integer, format: int64 }
        succeeded: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        successRate: { type: number, format: double }
        lastPrintAt: { type: [string, 'null'] }

    ReportLogRow:
      type: object
      required: [createdAt, taskId, templateCode, businessKey, attemptNo, status]
      properties:
        createdAt: { type: string }
        taskId: { type: string }
        templateCode: { type: string }
        templateVersion: { type: [integer, 'null'], minimum: 1 }
        businessKey: { type: string }
        attemptNo: { type: integer }
        printerId: { type: [string, 'null'] }
        status: { type: string }
        message: { type: [string, 'null'] }

    ProblemDetail:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Stable machine-readable platform error code, for example TEMPLATE_NOT_FOUND, TEMPLATE_STATE_CONFLICT, DATA_CONFIG_CORRUPTED, SECRET_REF_INVALID, or SECRET_NOT_RESOLVED.
        queryId: { type: [string, 'null'] }
        testRunId: { type: [string, 'null'] }
      additionalProperties: true

    DatabaseType:
      type: string
      enum: [SQLITE, MYSQL, POSTGRESQL, SQL_SERVER, ORACLE]

    CreatePdfPrintTaskRequest:
      type: object
      required: [title, businessKey, printerId, copies, pdfBase64]
      properties:
        title: { type: string, minLength: 1 }
        businessKey: { type: string, minLength: 1 }
        printerId: { type: string, minLength: 1 }
        copies: { type: integer, minimum: 1, maximum: 99 }
        pdfBase64:
          type: string
          minLength: 8
          description: Base64 PDF payload. The backend validates the %PDF- header and limits decoded size to 20 MB.

    CreateRawPrintTaskRequest:
      type: object
      required: [title, businessKey, printerId, copies, rawLanguage, rawBase64]
      properties:
        title: { type: string, minLength: 1 }
        businessKey: { type: string, minLength: 1 }
        printerId: { type: string, minLength: 1 }
        copies: { type: integer, minimum: 1, maximum: 1 }
        rawLanguage: { type: string, enum: [ESC_POS, ZPL, TSPL, CPCL] }
        rawBase64:
          type: string
          minLength: 1
          description: Final byte-exact RAW payload encoded as Base64. Retries reuse the immutable snapshot.

    SpoolerBindingRequest:
      type: object
      required: [agentJobId, spoolerJobId, documentName, spoolerStatus, boundAt]
      properties:
        agentJobId: { type: string, minLength: 1 }
        spoolerJobId: { type: integer, minimum: 1 }
        documentName: { type: string, minLength: 1 }
        spoolerStatus: { type: string, minLength: 1 }
        boundAt: { type: string, format: date-time }

    SpoolerStatusRequest:
      type: object
      required: [spoolerStatus]
      properties:
        spoolerStatus: { type: string, minLength: 1 }

    CreatePrintPreviewRequest:
      type: object
      required: [templateCode]
      properties:
        templateCode: { type: string, minLength: 1 }
        params:
          type: object
          additionalProperties: true
          description: Runtime SQL parameters for a published SQL-mode template.
        inputData:
          oneOf:
            - { $ref: '#/components/schemas/TemplateSampleData' }
            - { type: 'null' }
          description: Required for published JSON-mode templates. SQL mode rejects this field.

    PrintPreview:
      type: object
      required: [templateCode, templateVersion, templateName, documentType, design, renderData, generatedAt]
      properties:
        templateCode: { type: string }
        templateVersion: { type: integer, minimum: 1 }
        templateName: { type: string }
        documentType: { $ref: '#/components/schemas/DocumentType' }
        design: { $ref: '#/components/schemas/TemplateDesign' }
        renderData:
          type: object
          additionalProperties: true
        generatedAt: { type: string, format: date-time }

    CreatePrintTaskRequest:
      type: object
      required: [templateCode, businessKey, printerId, copies]
      properties:
        templateCode: { type: string, minLength: 1 }
        businessKey: { type: string, minLength: 1 }
        printerId: { type: [string, 'null'] }
        copies: { type: integer, minimum: 1 }
        params:
          type: object
          additionalProperties: true
          description: Runtime SQL parameters for a published SQL-mode template.
        inputData:
          oneOf:
            - { $ref: '#/components/schemas/TemplateSampleData' }
            - { type: 'null' }
          description: Required for a formal JSON-mode print task. The backend never falls back to template sampleData for formal printing. SQL mode rejects this field.

    FailPrintTaskRequest:
      type: object
      properties:
        reason: { type: [string, 'null'] }

    RetryPrintTaskRequest:
      type: object
      properties:
        printerId: { type: [string, 'null'] }

    WaitForAgentRequest:
      type: object
      properties:
        reason: { type: [string, 'null'] }

    PrintTaskStatus:
      type: string
      enum: [CREATED, QUEUED, PRINTING, SUCCESS, FAILED, RETRYING, WAITING_AGENT, CANCELLED]

    PrintTask:
      type: object
      required: [id, templateCode, businessKey, snapshotId, copies, status, attempts, createdAt, updatedAt]
      properties:
        id: { type: string }
        templateCode: { type: string }
        templateVersion: { type: [integer, 'null'], minimum: 1 }
        businessKey: { type: string }
        snapshotId: { type: string }
        printerId: { type: [string, 'null'] }
        copies: { type: integer }
        status: { $ref: '#/components/schemas/PrintTaskStatus' }
        attempts: { type: integer }
        message: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PrintTaskSummary:
      type: object
      required: [total, created, queued, printing, succeeded, failed, retrying, waitingAgent, cancelled, active]
      properties:
        total: { type: integer, format: int64 }
        created: { type: integer, format: int64 }
        queued: { type: integer, format: int64 }
        printing: { type: integer, format: int64 }
        succeeded: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        retrying: { type: integer, format: int64 }
        waitingAgent: { type: integer, format: int64 }
