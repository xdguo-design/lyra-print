    AgentHeartbeat:
      type: object
      required: [id, agentId, instanceId, activeJobs, queuedJobs, printerCount, createdAt]
      properties:
        id: { type: integer }
        agentId: { type: string }
        instanceId: { type: string }
        cpuUsage: { type: [number, 'null'] }
        memoryUsage: { type: [number, 'null'] }
        activeJobs: { type: integer }
        queuedJobs: { type: integer }
        printerCount: { type: integer }
        spoolerStatus: { type: [string, 'null'] }
        agentVersion: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    AgentHeartbeatRequest:
      type: object
      required: [agentId, instanceId, hostName, osName, agentVersion]
      properties:
        agentId: { type: string, maxLength: 128 }
        instanceId: { type: string, maxLength: 128 }
        hostName: { type: string, maxLength: 128 }
        ipAddress: { type: [string, 'null'], maxLength: 64 }
        osName: { type: string, maxLength: 128 }
        agentVersion: { type: string, maxLength: 64 }
        cpuUsage: { type: [number, 'null'], minimum: 0, maximum: 100 }
        memoryUsage: { type: [number, 'null'], minimum: 0, maximum: 100 }
        activeJobs: { type: [integer, 'null'], minimum: 0 }
        queuedJobs: { type: [integer, 'null'], minimum: 0 }
        printerCount: { type: [integer, 'null'], minimum: 0 }
        spoolerStatus: { type: [string, 'null'], maxLength: 32 }
